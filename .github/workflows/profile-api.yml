name: Deploy profile API

# Tests and deploys the Cloudflare Worker behind /profile/ (worker/), and
# hands it the vendors' keys as Worker secrets, from this repository's
# secrets. Nothing here is printed: wrangler-action passes them on masked.
# Setup and the secrets it needs: README.md, "Company profile".

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/profile-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the Worker
        working-directory: worker
        run: npm test
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FINNHUB_API_KEY FMP_API_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            FINNHUB_API_KEY
            FMP_API_KEY
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      - name: Say where it is
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          CURRENT: ${{ vars.PROFILE_API }}
        run: |
          {
            echo "### Profile API deployed"
            echo ""
            echo "Address: \`${URL:-see the Deploy step's log}\`"
            echo ""
            if [ -z "$CURRENT" ]; then
              echo "Next: add a repository **variable** named \`PROFILE_API\` with this address (Settings > Secrets and variables > Actions > Variables), then run *Deploy site to GitHub Pages*."
            else
              echo "The site calls \`$CURRENT\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

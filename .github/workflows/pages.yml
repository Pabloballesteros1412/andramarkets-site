name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "data/notes/**"
      - "reports/**"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Called by publish-notes.yml after it commits a note. A push made by a
  # workflow does not start other workflows on its own.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # When called after an import, build the commit it just pushed.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Build pages
        run: python3 tools/build_site.py
      # Publish only the public site, never repo docs, briefs, data or tooling.
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html methodology reports assets _site/
          rm -rf _site/assets/icons
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

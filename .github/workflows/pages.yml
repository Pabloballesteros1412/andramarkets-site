name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "data/notes/**"
      - "data/reports/**"
      - "data/interview_prep.json"
      - "data/path_to_wall_street.json"
      - "tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Refresh the dashboard tiles and the calendar on weekdays, before the US
  # open, even when no note is published; again after the US morning releases
  # (8:30 and 10:00 am ET) so their figures show the same day.
  # Once more in the evening, after the US Treasury posts the day's curve,
  # for Fed & Rates.
  schedule:
    - cron: "17 11 * * 1-5"
    - cron: "47 15 * * 1-5"
    - cron: "37 23 * * 1-5"
  # Called by publish-notes.yml after it commits a note (a push made by a
  # workflow does not start other workflows on its own), and by
  # market-strip.yml with strip_only, which refreshes the tape and rebuilds
  # from the other sources' cached figures without fetching them again.
  workflow_call:
    inputs:
      strip_only:
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploys queue rather than cancel: a strip refresh every 15 minutes must
    # never cut short a full deploy before it has saved its fetched figures.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # When called after an import, build the commit it just pushed.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      # The tiles' last good figures, so a source that is down keeps them
      # (with their own date). Only the figures the tiles draw are cached.
      - name: Restore dashboard figures
        uses: actions/cache/restore@v4
        with:
          path: .cache/dashboards
          key: dashboards-${{ github.run_id }}
          restore-keys: dashboards-
      - name: Fetch dashboard figures
        if: ${{ !inputs.strip_only }}
        env:
          AGENT_ARTIFACTS_TOKEN: ${{ secrets.AGENT_ARTIFACTS_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 tools/dashboard_data.py
      - name: Save dashboard figures
        if: ${{ !inputs.strip_only }}
        uses: actions/cache/save@v4
        with:
          path: .cache/dashboards
          key: dashboards-${{ github.run_id }}-${{ github.run_attempt }}
      # The calendar's last good copy of each source, and every week since it
      # started (the close notes link to their session).
      - name: Restore calendar
        uses: actions/cache/restore@v4
        with:
          path: .cache/calendar
          key: calendar-${{ github.run_id }}
          restore-keys: calendar-
      - name: Fetch calendar
        if: ${{ !inputs.strip_only }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 tools/calendar_data.py
      - name: Save calendar
        if: ${{ !inputs.strip_only }}
        uses: actions/cache/save@v4
        with:
          path: .cache/calendar
          key: calendar-${{ github.run_id }}-${{ github.run_attempt }}
      # The Lab risk tool's daily closes (tools/lab_data.py): only what was not
      # fetched today, within a time budget; the rest keep their last closes.
      - name: Restore Lab closes
        uses: actions/cache/restore@v4
        with:
          path: .cache/lab
          key: lab-${{ github.run_id }}
          restore-keys: lab-
      - name: Fetch Lab closes
        if: ${{ !inputs.strip_only }}
        continue-on-error: true
        run: python3 tools/lab_data.py
      - name: Save Lab closes
        if: ${{ !inputs.strip_only }}
        uses: actions/cache/save@v4
        with:
          path: .cache/lab
          key: lab-${{ github.run_id }}-${{ github.run_attempt }}
      # The World markets page (tools/world_data.py): Yahoo, OECD, World Bank,
      # IMF; each figure keeps its last good value and date when a source fails.
      - name: Restore world figures
        uses: actions/cache/restore@v4
        with:
          path: .cache/world
          key: world-${{ github.run_id }}
          restore-keys: world-
      - name: Fetch world figures
        if: ${{ !inputs.strip_only }}
        continue-on-error: true
        run: python3 tools/world_data.py
      - name: Save world figures
        if: ${{ !inputs.strip_only }}
        uses: actions/cache/save@v4
        with:
          path: .cache/world
          key: world-${{ github.run_id }}-${{ github.run_attempt }}
      # The FX section (tools/fx_data.py): the agent's daily FX analyses from
      # its archive releases (the same token as the dashboards) and the pairs
      # table from Yahoo; each keeps its last good copy when a source fails.
      - name: Restore FX
        uses: actions/cache/restore@v4
        with:
          path: .cache/fx
          key: fx-${{ github.run_id }}
          restore-keys: fx-
      - name: Fetch FX
        if: ${{ !inputs.strip_only }}
        continue-on-error: true
        env:
          AGENT_ARTIFACTS_TOKEN: ${{ secrets.AGENT_ARTIFACTS_TOKEN }}
        run: python3 tools/fx_data.py
      - name: Save FX
        if: ${{ !inputs.strip_only }}
        uses: actions/cache/save@v4
        with:
          path: .cache/fx
          key: fx-${{ github.run_id }}-${{ github.run_attempt }}
      # Each company's last good figures, so a Yahoo hiccup keeps its page
      # (with its own dates). Only the figures the pages draw are cached.
      - name: Restore company figures
        uses: actions/cache/restore@v4
        with:
          path: .cache/companies
          key: companies-${{ github.run_id }}
          restore-keys: companies-
      # A Yahoo outage must not stop the deploy: the pages keep their last
      # good figures, or are left out until the first good fetch.
      - name: Fetch company figures
        if: ${{ !inputs.strip_only }}
        continue-on-error: true
        run: python3 tools/company_data.py
      - name: Save company figures
        if: ${{ !inputs.strip_only }}
        uses: actions/cache/save@v4
        with:
          path: .cache/companies
          key: companies-${{ github.run_id }}-${{ github.run_attempt }}
      # Fed & Rates (tools/fedrates_data.py): every block on a full deploy; on a
      # market strip refresh only the futures and intraday yields (--fast).
      # Each block keeps its last good copy and date when a source fails.
      - name: Restore Fed & Rates
        uses: actions/cache/restore@v4
        with:
          path: .cache/fedrates
          key: fedrates-${{ github.run_id }}
          restore-keys: fedrates-
      - name: Fetch Fed & Rates
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 tools/fedrates_data.py ${{ inputs.strip_only && '--fast' || '' }}
      - name: Save Fed & Rates
        uses: actions/cache/save@v4
        with:
          path: .cache/fedrates
          key: fedrates-${{ github.run_id }}-${{ github.run_attempt }}
      # The tape between deploys (tools/strip_data.py): every figure keeps
      # its last good value and time when a source fails.
      - name: Restore market strip
        uses: actions/cache/restore@v4
        with:
          path: .cache/strip
          key: strip-${{ github.run_id }}
          restore-keys: strip-
      - name: Fetch market strip
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 tools/strip_data.py
      - name: Save market strip
        uses: actions/cache/save@v4
        with:
          path: .cache/strip
          key: strip-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build pages
        env:
          # The profile API's address (worker/, deployed by profile-api.yml).
          PROFILE_API: ${{ vars.PROFILE_API }}
        run: python3 tools/build_site.py
      # Publish only the public site, never repo docs, briefs, data or tooling.
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html methodology reports dashboards calendar assets _site/
          if [ -d companies ]; then cp -r companies _site/; fi
          cp -r watch _site/
          cp -r learn _site/
          cp -r world _site/
          cp -r fx _site/
          cp -r lab _site/
          cp -r research interview-prep sources legal privacy _site/
          cp -r fed-rates careers _site/
          cp -r profile _site/
          rm -rf _site/assets/icons
      # The site is free: no PDF or data file may ever be published.
      - name: Check no downloads are published
        run: |
          found=$(find _site -type f \( -iname '*.pdf' -o -iname '*.json' -o -iname '*.xlsx' -o -iname '*.csv' \))
          if [ -n "$found" ]; then echo "::error::Files that must not be published: $found"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

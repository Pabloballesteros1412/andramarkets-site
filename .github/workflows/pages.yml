name: Deploy prototypes to GitHub Pages

on:
  push:
    # The claude/ branch entry lets this PR publish a preview; drop it after merge.
    branches: [main, claude/compassionate-mayer-yefufr]
    paths:
      - "prototypes/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes
      - id: deployment
        uses: actions/deploy-pages@v4

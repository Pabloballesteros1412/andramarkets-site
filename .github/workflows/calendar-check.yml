name: Calendar check

# Runs the calendar fetcher against the live sources on a pull request that
# touches it, and prints what each source returned, so a publisher changing
# its page shows up before the change reaches the site. Deploys nothing and
# never fails on a source being down: the deploy keeps the last good copy.

on:
  pull_request:
    paths:
      - "tools/calendar_data.py"
      - "tools/dashboard_data.py"
      - "tools/build_site.py"
      - "assets/calendar.js"
      - ".github/workflows/calendar-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fetch every source
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 tools/calendar_data.py --probe
      - name: Build with the fetched calendar
        run: |
          mv .cache/calendar/probe.json .cache/calendar/calendar.json
          python3 tools/build_site.py
          test -f calendar/index.html

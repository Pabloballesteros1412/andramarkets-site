name: Diagnose agent artifacts (temporary)
on:
  push:
    branches: [claude/funny-noether-emdg4e]
    paths: ["tools/**", .github/workflows/diagnose-artifacts.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==5.1.0
      - env:
          AGENT_ARTIFACTS_TOKEN: ${{ secrets.AGENT_ARTIFACTS_TOKEN }}
        run: python3 tools/diagnose_artifacts.py

<div id="main" style="display:contents"><div id="map" aria-label="Live map of business jets"></div>
<header class="top glass">
  <div class="brand"><span class="opt">Andra Markets</span><b>Jets</b></div>
  <div class="stat live"><i></i><span>Positions</span><b id="s-age"></b></div>
  <div class="stat"><span>Business jets</span><b id="s-n"></b></div>
  <div class="stat opt"><span>In the air</span><b id="s-air"></b></div>
  <div class="stat opt"><span>Long range, in the air</span><b id="s-lr"></b></div>
  <div class="stat opt"><span>All aircraft in the air</span><b id="s-all"></b></div>
  <div class="grow"></div>
  <div class="seg" role="group" aria-label="Basemap"><button data-base="sat" aria-pressed="true">Satellite</button><button data-base="dark" aria-pressed="false">Chart</button></div>
</header>
<aside class="left glass" aria-label="Airfields and jets">
  <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="cp">Airfields</button><button role="tab" aria-selected="false" data-tab="vs">Jets in view</button></div>
  <div class="kinds" id="kinds" role="group" aria-label="Makers"></div>
  <div class="list cp" id="list-cp"></div>
  <div class="list vs" id="list-vs" hidden></div>
  <p class="foot" id="foot"></p>
</aside>
<aside class="card glass" id="card" aria-live="polite"></aside>
<div class="ro glass" id="ro"></div></div>

<div id="main" style="display:contents"><div id="map" aria-label="Map of heat anomalies and night lights seen from orbit"></div>
<header class="top glass">
  <div class="brand"><span class="opt">Andra Markets</span><b>From orbit</b></div>
  <div class="seg mode" role="group" aria-label="Layer"><button data-mode="heat" aria-pressed="true">Heat</button><button data-mode="lights" aria-pressed="false">Night lights</button></div>
  <div class="stat live"><i></i><span id="s1l"></span><b id="s1"></b></div>
  <div class="stat opt"><span id="s2l"></span><b id="s2"></b></div>
  <div class="stat opt"><span id="s3l"></span><b id="s3"></b></div>
  <div class="grow"></div>
  <div class="seg" role="group" aria-label="Basemap"><button data-base="night" aria-pressed="true">Night</button><button data-base="sat" aria-pressed="false">Satellite</button><button data-base="dark" aria-pressed="false">Chart</button></div>
</header>
<aside class="left glass" aria-label="Regions">
  <p class="note" id="note"></p>
  <div class="list cp" id="list"></div>
  <p class="foot" id="foot"></p>
</aside>
<aside class="card glass" id="card" aria-live="polite"></aside>
<div class="ro glass" id="ro"></div></div>
